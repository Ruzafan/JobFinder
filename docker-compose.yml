services:
  jobfinder:
    build: .
    container_name: jobfinder-cv-studio
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - JOBFINDER_DATA_DIR=/app/data
      - LAN_HOST=${LAN_HOST:-192.168.1.149}
      - PORT=${PORT:-8000}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - INFOJOBS_CLIENT_ID=${INFOJOBS_CLIENT_ID:-}
      - INFOJOBS_CLIENT_SECRET=${INFOJOBS_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
